%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters
# Source: Kalibr calibration report (cam_kalibr_02_mono8)
# Model: pinhole + equidistant (Kannala-Brandt)
# Reprojection error: [-0.000000, -0.000001] +- [0.792016, 0.822005] px
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "KannalaBrandt8"

# Camera intrinsics from Kalibr: [fx, fy, cx, cy]
Camera1.fx: 545.4318275957406
Camera1.fy: 544.808949128241
Camera1.cx: 343.5108408742363
Camera1.cy: 226.5228051124848

# Equidistant distortion coefficients (k1, k2, k3, k4)
Camera1.k1: -0.06683718148822111
Camera1.k2: -0.009650209768810673
Camera1.k3: -0.029825075641508617
Camera1.k4:  0.020281540657900984

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# IMU Parameters  (Yesense H30 / H30WP / H30MINI)
#
# Datasheet values used:
#   Gyroscope:
#     Noise density      = 0.005 deg/s/sqrt(Hz)
#     Bias instability   = 4 deg/h
#   Accelerometer:
#     Noise density      = 60 ug/sqrt(Hz)
#     Bias instability   = 35 uG
#
# Conversion to ORB-SLAM3 units:
#   NoiseGyro  = 0.005 * pi/180        = 8.7266e-05 rad/s/sqrt(Hz)
#   GyroWalk   = 4/3600 * pi/180       = 1.9393e-05 rad/s^1.5
#   NoiseAcc   = 60e-6 * 9.80665       = 5.8840e-04 m/s^2/sqrt(Hz)
#   AccWalk    = 35e-6 * 9.80665       = 3.4323e-04 m/s^2.5
#
# NOTE: ORB-SLAM3 expects *continuous-time* noise densities.
#       The values above are datasheet specs; you may need to multiply
#       by a safety factor (typically 2~10x) for real-world robustness.
#       Start with ~2x and tune if initialisation is unstable.
#--------------------------------------------------------------------------------------------

# Transformation from body-frame (imu) to camera
# Source: Kalibr calibration (imu_cam_kalibr_01_mono8.bag, 2026-03-27)
# T_cam0_imu0: IMU -> Camera transform
# Reprojection error: mean 1.06 px, median 0.80 px
# Time offset (t_imu = t_cam + shift): 0.2745 s
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.01511657, -0.99985794,  0.00745574, -0.00185846,
          -0.99959903,  0.01493326, -0.02405773,  0.00547476,
           0.02394298, -0.00781642, -0.99968277, -0.06329676,
           0.0,         0.0,         0.0,         1.0]

# Do not insert KFs when recently lost (helps with IMU-only tracking)
IMU.InsertKFsWhenLost: 0

# IMU noise parameters  (with ~2x safety factor applied)
IMU.NoiseGyro: 1.7453e-04   # rad/s/sqrt(Hz)  (datasheet 8.73e-5 x2)
IMU.NoiseAcc:  1.1768e-03   # m/s^2/sqrt(Hz)  (datasheet 5.88e-4 x2)
IMU.GyroWalk:  3.8786e-05   # rad/s^1.5       (datasheet 1.94e-5 x2)
IMU.AccWalk:   6.8647e-04   # m/s^2.5         (datasheet 3.43e-4 x2)
IMU.Frequency: 200.0        # Hz – H30 configured at 200Hz output rate

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1250

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# Lower these values if your images have low contrast
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
